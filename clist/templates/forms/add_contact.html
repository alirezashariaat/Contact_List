{% extends "base.html" %}
{% block title %}Add Contact{% endblock title %}

{% block content %}
<a href="{% url 'clist:contact_list' %}" class="back-link">&larr; Back to contacts</a>

<h1>Add a new contact</h1>

<form method="post" class="contact-form" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save contact</button>
        <a href="{% url 'clist:contact_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock content %}
