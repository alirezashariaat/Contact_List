<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Contacts{% endblock title %} · ContactBook</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --danger: #dc2626;
            --input-bg: #fafafa;
            --input-bg-focus: #ffffff;
        }
        :root[data-theme="dark"] {
            --primary: #3b82f6;
            --primary-dark: #60a5fa;
            --text: #e5e7eb;
            --text-muted: #9ca3af;
            --border: #2d333b;
            --bg: #0d1117;
            --card-bg: #161b22;
            --danger: #f87171;
            --input-bg: #0d1117;
            --input-bg-focus: #161b22;
        }
        * { transition: background 0.15s, border-color 0.15s, color 0.15s; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        a { color: inherit; }

        /* Top bar */
        .topbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 0.9rem 1.5rem;
        }
        .topbar-inner {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .brand {
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .brand-icon {
            width: 28px; height: 28px;
            background: var(--primary);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 0.9rem; font-weight: 700;
        }
        .theme-toggle {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 36px; height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
        }
        .theme-toggle:hover { border-color: var(--primary); }

        main {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1.5rem 3rem;
        }

        /* Contact list header */
        .contacts-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .contacts-header h1 { margin: 0; font-size: 1.5rem; }
        .contact-count {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-right: auto;
            background: var(--border);
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.55rem 1rem;
            border-radius: 7px;
            text-decoration: none;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-secondary:hover { filter: brightness(0.92); }

        /* Contact list */
        .contact-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.6rem; }
        .contact-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
        }
        .contact-card:hover { border-color: var(--primary); }
        .contact-link {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            padding: 0.85rem 1.1rem;
            text-decoration: none;
            color: var(--text);
        }
        .avatar {
            flex-shrink: 0;
            width: 42px; height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
        }
        .contact-info { flex: 1; min-width: 0; }
        .contact-name { font-weight: 600; display: block; }
        .contact-phone {
            color: var(--text-muted);
            font-size: 0.85rem;
            display: flex; align-items: center; gap: 0.3rem;
        }
        .chevron { color: var(--text-muted); flex-shrink: 0; }

        .contact-empty {
            padding: 3rem 1rem;
            text-align: center;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 1px dashed var(--border);
            border-radius: 10px;
        }
        .contact-empty .emoji { font-size: 2rem; display: block; margin-bottom: 0.5rem; }

        /* Detail page */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            margin-bottom: 1.2rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .back-link:hover { color: var(--primary); }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .avatar-lg {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700;
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .detail-header h1 { margin: 0; font-size: 1.4rem; }
        .detail-header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.15rem; }

        .detail-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .detail-row {
            display: flex;
            gap: 0.9rem;
            align-items: flex-start;
            padding: 0.9rem 1.1rem;
            border-bottom: 1px solid var(--border);
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-icon {
            width: 20px; text-align: center;
            color: var(--primary);
            flex-shrink: 0;
            margin-top: 0.1rem;
        }
        .detail-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-bottom: 0.15rem; }
        .detail-value { font-size: 1rem; word-break: break-word; }

        .detail-actions { margin-top: 1.2rem; display: flex; gap: 0.6rem; }

        /* Form */
        .contact-form {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.4rem 1.5rem;
            margin-top: 1rem;
        }
        .contact-form p { margin: 0 0 1.1rem; }
        .contact-form label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.35rem;
        }
        .contact-form input,
        .contact-form textarea,
        .contact-form select {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--text);
        }
        .contact-form input:focus,
        .contact-form textarea:focus,
        .contact-form select:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--input-bg-focus);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .contact-form .help-text { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem; }
        .contact-form ul.errorlist {
            list-style: none;
            padding: 0;
            margin: 0.3rem 0 0;
            color: var(--danger);
            font-size: 0.82rem;
        }
        .form-actions { display: flex; gap: 0.6rem; margin-top: 0.3rem; }
                /* Responsive */
        @media (max-width: 640px) {
            .topbar { padding: 0.75rem 1rem; }
            .brand { font-size: 1rem; }
            .brand-icon { width: 24px; height: 24px; font-size: 0.8rem; }

            main { margin: 1.25rem auto; padding: 0 1rem 2rem; }

            .contacts-header {
                flex-wrap: wrap;
                row-gap: 0.6rem;
            }
            .contacts-header h1 { font-size: 1.25rem; }
            .contact-count { order: 3; margin-right: 0; }
            .contacts-header .btn { margin-left: auto; }

            .contact-link { padding: 0.7rem 0.85rem; gap: 0.7rem; }
            .avatar { width: 36px; height: 36px; font-size: 0.85rem; }
            .contact-name { font-size: 0.95rem; }
            .contact-phone { font-size: 0.8rem; }

            .detail-header { gap: 0.75rem; margin-bottom: 1.2rem; }
            .avatar-lg { width: 52px; height: 52px; font-size: 1.1rem; }
            .detail-header h1 { font-size: 1.15rem; }

            .detail-row { padding: 0.75rem 0.9rem; }

            .contact-form { padding: 1.1rem 1.1rem; }

            .form-actions { flex-direction: column; }
            .form-actions .btn { width: 100%; justify-content: center; }

            .detail-actions { flex-direction: column; }
            .detail-actions .btn { width: 100%; justify-content: center; }
        }

        @media (max-width: 380px) {
            .brand span:not(.brand-icon) { display: none; }
            .contacts-header .btn span.label { display: none; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <a href="{% url 'clist:contact_list' %}" class="brand">
                <span class="brand-icon">C</span>
                ContactBook
            </a>
            <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
        </div>
    </div>
    <main>
        {% block content %}
        {% endblock content %}
    </main>

    <script>
        (function () {
            const root = document.documentElement;
            const toggle = document.getElementById('themeToggle');
            const stored = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const initial = stored || (prefersDark ? 'dark' : 'light');

            setTheme(initial);

            toggle.addEventListener('click', function () {
                const current = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                setTheme(current);
                localStorage.setItem('theme', current);
            });

            function setTheme(theme) {
                if (theme === 'dark') {
                    root.setAttribute('data-theme', 'dark');
                    toggle.textContent = '☀️';
                } else {
                    root.removeAttribute('data-theme');
                    toggle.textContent = '🌙';
                }
            }
        })();
    </script>
</body>
</html>
